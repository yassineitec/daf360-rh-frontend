server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This server is only ever reached THROUGH the shell's proxy (/remotes/rh/), so a
    # redirect it generates itself would be built from its own http://…:80 identity and sent
    # to the browser as-is — wrong scheme and wrong port. Relative Location headers are the
    # only correct answer behind a proxy.
    absolute_redirect off;
    port_in_redirect  off;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "no-cache" always;

    # No `$uri/`: it only ever produced directory redirects (see absolute_redirect above).
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }
}
