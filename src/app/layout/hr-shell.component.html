<!-- Sidebar — daf-side-nav owns its own responsive behaviour (fixed left rail
     on desktop, fixed bottom bar on mobile), so no custom drawer/hamburger here. -->
<daf-side-nav
  [items]="navItems()"
  [config]="sideNavConfig()"
  [activeRoute]="activeRoute()"
  (itemClick)="onNavClick($event)">
  <!-- « Centre d'aide », in the rail's footer slot (lib 5.13.0): under the item list,
       which scrolls above it instead of passing under it. Desktop rail only. -->
  <rh-help-center dafSideNavFooter />
</daf-side-nav>

<main class="shell-content">
  <router-outlet />
</main>

<!-- « Première visite ? »: offers a page's guide the first time the page is opened. -->
<rh-guide-hint />

<!-- Help assistant, Messenger-style bubble at the bottom right of every RH page. -->
<rh-help-chat />
