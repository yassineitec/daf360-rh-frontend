<!-- /rh/candidates/list — canonical page shape (UI-PLAYBOOK §1).
     `daf-page` owns the 32px rhythm: no `mb-8` between sections, no outer card
     around the table, no hand-rolled `h1`. `kpis="3"` matches the three tiles. -->
<daf-page [loading]="firstLoad()" [kpis]="3">

  <daf-page-header
    [title]="'CANDIDATES.LIST.TITLE' | translate"
    [subtitle]="'CANDIDATES.LIST.SUBTITLE' | translate">
    <ng-container pageActions>
      <daf-button *dafHasPermission="'CREATE_CANDIDATE'"
        [options]="{ variant: 'teal', label: ('CANDIDATES.ACTIONS.NEW_CANDIDATE' | translate), iconStart: 'person_add' }"
        (onClick)="onNewCandidate()" />
    </ng-container>
  </daf-page-header>

  <!-- KPIs — one row at every width. `text-amber` / `bg-amber/10` on the middle
       tile rendered nothing: `amber` is not a token (§4). It is `warning` now. -->
  <section class="grid grid-cols-3 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'CANDIDATES.STATS.TOTAL' | translate"
      [value]="totalMetricValue()"
      [options]="{ icon: 'group', iconColor: 'text-primary', iconBg: 'bg-primary/10' }" />

    <daf-metric-card
      [label]="'CANDIDATES.STATS.PENDING' | translate"
      [value]="pendingMetricValue()"
      [options]="{ icon: 'schedule', iconColor: 'text-warning', iconBg: 'bg-warning/10' }" />

    <daf-metric-card
      [label]="'CANDIDATES.STATS.HIRED' | translate"
      [value]="hiredMetricValue()"
      [options]="{ icon: 'how_to_reg', iconColor: 'text-teal', iconBg: 'bg-teal/10' }" />
  </section>

  <!-- Search + filters: one lib toolbar. Replaces the "Afficher/Masquer les
       filtres" row, the search bar, the loose status select and the
       Appliquer / Réinitialiser pair — the panel applies and resets itself. -->
  <daf-search-toolbar
    [placeholder]="'CANDIDATES.LIST.SEARCH_PLACEHOLDER' | translate"
    [value]="search()"
    [debounce]="300"
    (valueChange)="onSearch($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)" />

  @if (actionError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ actionError() }}
    </div>
  }

  <!-- The table sits free in the page (§1) and is shared with /rh/recrutement.
       A row click opens the dossier drawer; "Voir" opens the candidate. -->
  <rh-candidates-table-section
    [candidates]="candidates()"
    [loading]="loading()"
    [skeletonRows]="pageSize()"
    [canAcceptReject]="canAcceptReject()"
    [actioningId]="actioningId()"
    [statusBadge]="statusBadgeCell()"
    (rowActivate)="openDossier($event)"
    (open)="onView($event)"
    (accept)="quickAccept($event)"
    (reject)="openRejectModal($event)" />

  @if (totalPages() > 0) {
    <daf-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalElements]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" />
  }

</daf-page>

<!-- Dossier drawer (daf-drawer, §10e). Kept at the page root: the panel is
     `position: fixed`, and any ancestor carrying transform / filter /
     backdrop-filter would become its containing block. -->
<rh-candidate-dossier-panel
  [(open)]="dossierOpen"
  [candidate]="selectedCandidate()"
  [history]="history()"
  [loading]="historyLoading()"
  [statusLabel]="statusLabel()" />

<!-- Reject modal -->
<app-reject-modal
  [visible]="rejectTarget() !== null"
  [target]="rejectTarget()"
  (closed)="rejectTarget.set(null)"
  (rejected)="onRejected()" />
