<!-- /rh/recrutement — canonical page shape (UI-PLAYBOOK §1).
     `daf-page` owns the 32px vertical rhythm, so there is no wrapper gap, no
     `space-y-*` between sections and no full-page spinner. `kpis="3"` matches
     the three funnel tiles, so the first-load skeleton doesn't draw a fourth
     that never resolves. No `icon` on the header — page titles carry none. -->
<daf-page [loading]="firstLoad()" [kpis]="3">

  <daf-page-header
    [title]="'CANDIDATES.PIPELINE_RH.TITLE' | translate"
    [subtitle]="'CANDIDATES.PIPELINE_RH.SUBTITLE' | translate">
    <ng-container pageActions>
      <daf-button *dafHasPermission="'CREATE_CANDIDATE'"
        [options]="{ variant: 'teal', label: ('CANDIDATES.ACTIONS.NEW_CANDIDATE' | translate), iconStart: 'add' }"
        (onClick)="onNewCandidate()" />
    </ng-container>
  </daf-page-header>

  <!-- KPIs — one row at every width, never wraps -->
  <section class="grid grid-cols-3 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'CANDIDATES.PIPELINE_RH.KPI_ACTIVE' | translate"
      [value]="activeMetricValue()"
      [delta]="activeDelta()"
      [options]="{ icon: 'groups', iconColor: 'text-primary', iconBg: 'bg-primary/10' }" />

    <daf-metric-card
      [label]="'CANDIDATES.PIPELINE_RH.KPI_ACCEPTANCE' | translate"
      [value]="acceptanceMetricValue()"
      [options]="{ icon: 'thumb_up', iconColor: 'text-teal', iconBg: 'bg-teal/10' }" />

    <daf-metric-card
      [label]="'CANDIDATES.PIPELINE_RH.KPI_HIRED' | translate"
      [value]="hiredMetricValue()"
      [options]="{ icon: 'how_to_reg', iconColor: 'text-teal', iconBg: 'bg-teal/10' }" />
  </section>

  <!-- Search + filters + view toggle: one lib toolbar, one card. The status
       dropdown lives inside the filter panel, not loose beside the search. -->
  <daf-search-toolbar
    [placeholder]="'CANDIDATES.PIPELINE_RH.SEARCH_PLACEHOLDER' | translate"
    [value]="search()"
    [debounce]="300"
    (valueChange)="onSearch($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="setView($event)" />

  @if (actionError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ actionError() }}
    </div>
  }

  @if (notice()) {
    <div class="flex items-center gap-2 rounded-xl bg-primary/10 px-4 py-3 text-sm text-primary">
      <span class="material-symbols-outlined text-[18px]">info</span>
      <span class="flex-1">{{ notice() }}</span>
      <button type="button" class="text-primary/70 hover:text-primary" (click)="notice.set(null)">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  }

  <!-- Content sits free in the page — never wrapped in an outer daf-card (§1).
       Each section renders only at its own breakpoint (host class), so there is
       no duplicated desktop/mobile tree here (§8b). -->
  @if (viewMode() === 'kanban') {
    <rh-candidates-board-section
      [columns]="kanbanColumns()"
      [loading]="kanbanLoading()"
      [draggedId]="draggedId()"
      [dragOverKey]="dragOverKey()"
      [statusLabel]="statusLabel()"
      (open)="onView($event)"
      (toggleSort)="toggleColumnSort($event)"
      (dragStart)="onDragStart($event)"
      (dragEnd)="onDragEnd()"
      (dragOver)="onDragOver($event)"
      (dragLeave)="onDragLeave($event)"
      (cardDrop)="onDrop($event)" />
  } @else {
    <!-- The table section carries no breakpoint class of its own — this page is
         the one that pairs it with a mobile card list, so it gates it here. -->
    <rh-candidates-table-section
      class="hidden sm:block"
      [candidates]="candidates()"
      [loading]="loading()"
      [skeletonRows]="pageSize()"
      [canAcceptReject]="canAcceptReject()"
      [actioningId]="actioningId()"
      [statusBadge]="statusBadgeCell()"
      (open)="onView($event)"
      (rowActivate)="onView($event)"
      (accept)="quickAccept($event)"
      (reject)="openRejectModal($event)" />
  }

  <!-- Mobile is always the card list: a horizontal kanban and a data table are
       both unusable at that width. -->
  <rh-candidates-mobile-section
    [columns]="kanbanColumns()"
    [candidates]="mobileCandidates()"
    [totalCount]="visibleKanbanCount()"
    [stageFilter]="mobileStageFilter()"
    [loading]="kanbanLoading()"
    [canAcceptReject]="canAcceptReject()"
    [actioningId]="actioningId()"
    [statusLabel]="statusLabel()"
    [accentFor]="accentFor()"
    [badgeBgFor]="badgeBgFor()"
    (stageFilterChange)="mobileStageFilter.set($event)"
    (open)="onView($event)"
    (accept)="quickAccept($event)"
    (reject)="openRejectModal($event)" />

  <!-- List view only — the board holds the whole tenant set in one fetch. -->
  @if (viewMode() === 'list' && totalPages() > 0) {
    <daf-pagination
      class="hidden sm:block"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalElements]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" />
  }

</daf-page>

<!-- Insights drawer (daf-drawer, 4.11.0). Kept at the page root: the panel is
     `position: fixed`, and any ancestor carrying transform / filter /
     backdrop-filter — daf-card's glass variant, for one — would become its
     containing block and position it against the card instead of the viewport. -->
<rh-recruitment-insights-panel
  [activities]="recentActivities()"
  [objective]="currentObjective()"
  [progress]="objectiveProgress()"
  [loading]="extrasLoading()" />

<!-- Reject modal -->
<app-reject-modal
  [visible]="rejectTarget() !== null"
  [target]="rejectTarget()"
  (closed)="rejectTarget.set(null)"
  (rejected)="onRejected()" />
