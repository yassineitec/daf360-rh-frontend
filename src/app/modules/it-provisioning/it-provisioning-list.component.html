<!-- /rh/it-provisioning — canonical page shape (UI-PLAYBOOK §1). `daf-page` owns
     the 32px rhythm, so there is no `space-y-8` wrapper and no gap between
     sections. `kpis="4"` matches the four tiles. -->
<daf-page [loading]="firstLoad()" [kpis]="4">

  <daf-page-header
    [title]="'IT_PROVISIONING.LIST.TITLE' | translate"
    [subtitle]="'IT_PROVISIONING.LIST.SUBTITLE' | translate:{ count: stats().pending }" />

  <!-- KPIs — one row at every width. The two right-hand tiles used `text-amber` /
       `bg-amber/10`, which renders nothing: `amber` is not a token (§4). -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'IT_PROVISIONING.LIST.KPI_PENDING' | translate"
      [value]="stats().pending"
      [delta]="pendingDelta()"
      [options]="{ icon: 'assignment_late', iconColor: 'text-primary', iconBg: 'bg-primary/10' }" />

    <daf-metric-card
      [label]="'IT_PROVISIONING.LIST.KPI_OVERDUE' | translate"
      [value]="stats().overdue"
      [delta]="overdueDelta()"
      [options]="{ icon: 'error', iconColor: 'text-danger', iconBg: 'bg-danger/10' }" />

    <daf-metric-card
      [label]="'IT_PROVISIONING.LIST.KPI_HW_INCOMPLETE' | translate"
      [value]="stats().hwIncomplete"
      [delta]="hwDelta()"
      [options]="{ icon: 'package_2', iconColor: 'text-warning', iconBg: 'bg-warning/10' }" />

    <daf-metric-card
      [label]="'IT_PROVISIONING.LIST.KPI_LIC_INCOMPLETE' | translate"
      [value]="stats().licIncomplete"
      [delta]="licDelta()"
      [options]="{ icon: 'subscriptions', iconColor: 'text-warning', iconBg: 'bg-warning/10' }" />
  </section>

  <!-- Search + status filter + refresh + view toggle: one lib toolbar, one card,
       one breakpoint. This replaces two separate hand-built cards (a desktop one
       and a mobile one with its own search toggle), the loose status `daf-select`
       and the bespoke refresh and grid/list buttons. -->
  <daf-search-toolbar
    [placeholder]="'IT_PROVISIONING.LIST.SEARCH_PLACEHOLDER' | translate"
    [value]="search()"
    [debounce]="300"
    (valueChange)="onSearch($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="setView($event)" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — never wrapped in an outer daf-card (§1).
       Both views render at every width now: the cards grid goes 1 → 2 → 3
       columns, and the table scrolls horizontally inside daf-data-table. -->
  @if (viewMode() === 'grid') {
    <rh-it-provisioning-cards-section
      [items]="pagedItems()"
      [loading]="loading()"
      (open)="open($event)" />
  } @else {
    <rh-it-provisioning-table-section
      [items]="pagedItems()"
      [loading]="loading()"
      [skeletonRows]="pageSize()"
      (open)="open($event)" />
  }

  @if (totalPages() > 0) {
    <daf-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalElements]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" />
  }

</daf-page>
