<!-- `daf-page` owns the vertical rhythm (32px between its direct children) and the
     first-load skeleton, so this template carries no wrapper gap, no `space-y-*`
     between sections and no spinner of its own (UI-PLAYBOOK §1, §5).

     Per §8b the page is only `daf-page` + `daf-page-header` + the toolbar + one
     section component per view + pagination. Both sections are stateless shells:
     search text, filters, selection and paging all live in the component, which
     is why switching view keeps every one of them.

     `kpis="4"` (the default, spelled out) so the first-load skeleton matches the
     KPI row below. -->
<daf-page [loading]="firstLoad()" [kpis]="4">

  <!-- No `icon` — page headers carry no icon (UI-PLAYBOOK §1). -->
  <daf-page-header
    [title]="'PROFILES.LIST.TITLE' | translate"
    [subtitle]="'PROFILES.LIST.SUBTITLE' | translate" />

  <!-- All four come from /employees/stats and follow the pays filter only: the search
       and the other filters leave them alone. -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'PROFILES.KPI.TOTAL' | translate"
      [value]="stats()?.total ?? '—'"
      [options]="{ icon: 'groups', iconColor: 'text-primary', iconBg: 'bg-primary/10',
                   help: ('PROFILES.KPI.TOTAL_HELP' | translate) }" />

    <!-- Hired over the last 3 months, today included. -->
    <daf-metric-card
      [label]="'PROFILES.KPI.RECENT_HIRES' | translate"
      [value]="stats()?.recentHires ?? '—'"
      [options]="{ icon: 'person_add', iconColor: 'text-secondary', iconBg: 'bg-secondary/10',
                   help: ('PROFILES.KPI.RECENT_HIRES_HELP' | translate) }" />

    <!-- The three in-service statuses: who is at their post, then who is away from it.
         Profile-less accounts have no status, so the three can sum below card 1. -->
    <daf-split-value-card
      [primaryLabel]="'PROFILES.KPI.ACTIVE' | translate"
      [primaryValue]="stats()?.active ?? '—'"
      [secondaryValues]="statusSplit()"
      [options]="{ icon: 'badge', iconColor: 'text-tertiary', iconBg: 'bg-tertiary/10' }" />

    <!-- Contracts by nature: CDI as the headline, CDD and every other type beside it.
         Profile-less accounts have no contract, so the three can sum below card 1. -->
    <daf-split-value-card
      [primaryLabel]="'PROFILES.KPI.CDI' | translate"
      [primaryValue]="stats()?.cdi ?? '—'"
      [secondaryValues]="contractSplit()"
      [options]="{ icon: 'contract', iconColor: 'text-success', iconBg: 'bg-success/10' }" />
  </section>

  <daf-search-toolbar
    [placeholder]="'PROFILES.LIST.SEARCH_PLACEHOLDER' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))"
    [table]="tableSection()?.table() ?? null" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-body-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — never wrapped in an outer daf-card (§1) -->
  @if (viewMode() === 'grid') {
    <rh-profiles-cards-section
      [employees]="employees()"
      [selectedIds]="selectedIds()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [canEdit]="canEdit()"
      [canCreateProfile]="canCreateProfile()"
      (viewProfile)="onViewProfile($event)"
      (toggleSelect)="toggleSelect($event)"
      (edit)="onEdit($event)" />
  } @else {
    <rh-profiles-table-section
      [employees]="employees()"
      [selectedIds]="selectedIds()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [canEdit]="canEdit()"
      [canCreateProfile]="canCreateProfile()"
      (viewProfile)="onViewProfile($event)"
      (toggleSelect)="toggleSelect($event)"
      (selectionChange)="setSelection($event)"
      [sort]="sort()"
      (sortChange)="onSortChange($event)"
      (edit)="onEdit($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    [perPageLabel]="'PROFILES.LIST.PER_PAGE' | translate"
    [summaryLabel]="'PROFILES.LIST.RANGE_SUMMARY' | translate"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)" />

</daf-page>

<!-- Bulk bar: the @if unmounts it (rather than hiding it) once the count hits 0.
     `totalCount` is the loaded page length, so "Tout sélectionner (N)" can only
     ever select rows the page actually holds (§7b). -->
@if (selectedCount() > 0) {
  <daf-bulk-action-bar
    [count]="selectedCount()"
    [totalCount]="employees().length"
    [actions]="bulkActions()"
    [countLabel]="'PROFILES.BULK.COUNT_LABEL' | translate"
    [selectAllLabel]="'PROFILES.BULK.SELECT_ALL' | translate"
    [allSelectedLabel]="'PROFILES.BULK.ALL_SELECTED' | translate"
    [cancelLabel]="'PROFILES.BULK.CANCEL' | translate"
    (selectAll)="selectAll()"
    (actionClick)="onBulkAction($event)"
    (cancel)="clearSelection()" />
}
