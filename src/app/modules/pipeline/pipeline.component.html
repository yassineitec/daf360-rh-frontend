<!-- /rh/candidates — canonical page shape (UI-PLAYBOOK §1).
     `daf-page` owns the 32px vertical rhythm, so there is no wrapper gap, no
     `space-y-*` between sections and no full-page spinner. `kpis="3"` matches the
     three tiles, so the first-load skeleton doesn't draw a fourth that never
     resolves. No `icon` on the header — page titles carry none. -->
<daf-page [loading]="firstLoad()" [kpis]="3">

  <daf-page-header
    [title]="'PIPELINE.TITLE' | translate"
    [subtitle]="'PIPELINE.SUBTITLE' | translate">
    <ng-container pageActions>
      <daf-button *dafHasPermission="'CREATE_CANDIDATE'"
        [options]="{ variant: 'teal', label: ('PIPELINE.NEW_CANDIDATE' | translate), iconStart: 'add' }"
        (onClick)="onNewCandidate()" />
    </ng-container>
  </daf-page-header>

  <!-- KPIs — one row at every width, never wraps. The bespoke mobile stat strip
       is gone: three metric cards at grid-cols-3 gap-2 cover both widths. -->
  <section class="grid grid-cols-3 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'PIPELINE.KPI_TOTAL' | translate"
      [value]="totalMetricValue()"
      [delta]="totalDelta()"
      [options]="{ icon: 'group', iconColor: 'text-primary', iconBg: 'bg-primary/10' }" />

    <daf-metric-card
      [label]="'PIPELINE.KPI_AVG_DELAY' | translate"
      [value]="delayMetricValue()"
      [delta]="delayDelta()"
      [options]="{ icon: 'timer', iconColor: 'text-teal', iconBg: 'bg-teal/10' }" />

    <daf-metric-card
      [label]="'PIPELINE.KPI_URGENT' | translate"
      [value]="urgentMetricValue()"
      [delta]="urgentDelta()"
      [options]="{ icon: 'priority_high', iconColor: 'text-danger', iconBg: 'bg-danger/10' }" />
  </section>

  <!-- Search + filters + view toggle: one lib toolbar, one card. Replaces the
       hand-rolled search card, its mobile search toggle and the bespoke
       kanban/list button pair. The stage dropdown lives inside the filter panel. -->
  <daf-search-toolbar
    [placeholder]="'PIPELINE.SEARCH_PLACEHOLDER' | translate"
    [value]="search()"
    [debounce]="300"
    (valueChange)="onSearch($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="setView($event)" />

  @if (actionError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ actionError() }}
    </div>
  }

  @if (notice()) {
    <div class="flex items-center gap-2 rounded-xl bg-primary/10 px-4 py-3 text-sm text-primary">
      <span class="material-symbols-outlined text-[18px]">info</span>
      <span class="flex-1">{{ notice() }}</span>
      <button type="button" class="text-primary/70 hover:text-primary" (click)="notice.set(null)">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  }

  <!-- Content sits free in the page — never wrapped in an outer daf-card (§1).
       Each section renders only at its own breakpoint (host class), so there is
       no duplicated desktop/mobile tree here (§8b). -->
  @if (viewMode() === 'kanban') {
    <rh-pipeline-board-section
      [columns]="boardColumns()"
      [offboarding]="offboardingActive()"
      [showOffboarding]="canViewOffboarding()"
      [loading]="loading()"
      [actioningId]="actioningId()"
      (open)="onView($event)"
      (openOffboarding)="onViewOffboarding($event)"
      (toggleSort)="toggleColumnSort($event)"
      (sendOffer)="openOfferModal($event, 'send')"
      (acceptOffer)="acceptOffer($event)"
      (renegotiate)="openOfferModal($event, 'renegotiate')"
      (refuse)="openRefuseModal($event)" />
  } @else {
    <rh-pipeline-table-section
      [columns]="boardColumns()"
      [loading]="loading()"
      (open)="onView($event)" />
  }

  <!-- Mobile is always the card list: a horizontal board and a data table are
       both unusable at that width. -->
  <rh-pipeline-mobile-section
    [columns]="boardColumns()"
    [items]="mobileItems()"
    [totalCount]="visibleCount()"
    [stageFilter]="mobileStageFilter()"
    [offboarding]="offboardingActive()"
    [showOffboarding]="canViewOffboarding()"
    [loading]="loading()"
    [actioningId]="actioningId()"
    (stageFilterChange)="mobileStageFilter.set($event)"
    (open)="onView($event)"
    (openOffboarding)="onViewOffboarding($event)"
    (sendOffer)="openOfferModal($event, 'send')"
    (acceptOffer)="acceptOffer($event)"
    (renegotiate)="openOfferModal($event, 'renegotiate')"
    (refuse)="openRefuseModal($event)" />

</daf-page>

<!-- Modals live at the page root, outside `daf-page`: the overlay is
     `position: fixed`, and an ancestor carrying transform / filter /
     backdrop-filter would become its containing block. -->
<rh-offer-modal
  [visible]="offerTarget() !== null"
  [candidate]="offerTarget()"
  [mode]="offerMode()"
  [initial]="offerInitial()"
  [submitting]="offerSubmitting()"
  [error]="offerError()"
  (closed)="closeOfferModal()"
  (submit)="submitOffer($event)" />

<rh-refuse-offer-modal
  [visible]="refuseTarget() !== null"
  [candidate]="refuseTarget()"
  [submitting]="refuseSubmitting()"
  [error]="refuseError()"
  (closed)="closeRefuseModal()"
  (submit)="submitRefuse($event)" />
