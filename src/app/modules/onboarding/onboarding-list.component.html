<!-- /rh/onboarding — canonical page shape (UI-PLAYBOOK §1). `daf-page` owns the
     32px rhythm, so there is no `space-y-6` wrapper and no gap between sections.
     `kpis="4"` matches the four tiles. -->
<daf-page [loading]="firstLoad()" [kpis]="4">

  <daf-page-header
    [title]="'ONBOARDING.LIST.TITLE' | translate"
    [subtitle]="'ONBOARDING.LIST.SUBTITLE' | translate">
  </daf-page-header>

  <!-- KPIs — one row at every width. The "temps moyen" tile used `text-amber` /
       `bg-amber/10`, which renders nothing: `amber` is not a token (§4). -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'ONBOARDING.LIST.KPI_PENDING' | translate"
      [value]="kpiPending()"
      [delta]="pendingDelta()"
      [options]="{ icon: 'pending_actions', iconColor: 'text-primary', iconBg: 'bg-primary/10' }" />

    <daf-metric-card
      [label]="'ONBOARDING.LIST.KPI_CREATED_TODAY' | translate"
      [value]="kpiStats()?.profilesCreatedToday ?? '—'"
      [delta]="createdTodayDelta()"
      [options]="{ icon: 'person_add', iconColor: 'text-teal', iconBg: 'bg-teal/10' }" />

    <daf-metric-card
      [label]="'ONBOARDING.LIST.KPI_INCOMPLETE' | translate"
      [value]="kpiStats()?.incompleteProfiles ?? '—'"
      [delta]="incompleteDelta()"
      [options]="{ icon: 'error_outline', iconColor: 'text-danger', iconBg: 'bg-danger/10' }" />

    <daf-metric-card
      [label]="'ONBOARDING.LIST.KPI_AVG_TIME' | translate"
      [value]="kpiAvgTime()"
      [delta]="avgTimeDelta()"
      [options]="{ icon: 'timer', iconColor: 'text-warning', iconBg: 'bg-warning/10' }" />
  </section>

  <!-- Search + status filter + view toggle: one lib toolbar, one card, one
       breakpoint. Replaces the hand-built card that held a desktop search box, a
       mobile search toggle, a square refresh button and a grid/list button pair. -->
  <daf-search-toolbar
    [placeholder]="'ONBOARDING.LIST.SEARCH_PLACEHOLDER' | translate"
    [value]="search()"
    [debounce]="300"
    (valueChange)="onSearch($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="setView($event)" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — never wrapped in an outer daf-card (§1).
       Both views render at every width now: the cards grid goes 1 → 2 → 3
       columns, and the table scrolls horizontally inside daf-data-table. -->
  @if (viewMode() === 'grid') {
    <rh-onboarding-cards-section
      [items]="pagedItems()"
      [loading]="loading()"
      (open)="open($event)" />
  } @else {
    <rh-onboarding-table-section
      [items]="pagedItems()"
      [loading]="loading()"
      [skeletonRows]="pageSize()"
      (open)="open($event)" />
  }

  @if (totalPages() > 0) {
    <daf-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalElements]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" />
  }

</daf-page>
