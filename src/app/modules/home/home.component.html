<!-- `daf-page` owns the vertical rhythm (32px between its direct children) and the
     first-load skeleton, so this page carries no wrapper gap and no spinner of its
     own. Per UI-PLAYBOOK §1 the page template is only `daf-page` + `daf-page-header`
     + section components — each section owns its own desktop and mobile rendering.

     `order-*` handles the one place the two layouts disagree: mobile leads with the
     KPI strip, desktop leads with the shortcut cards. daf-page's child wrapper is a
     flex column, so `order` applies directly. -->
<daf-page [loading]="loading()">

  <daf-page-header
    [title]="'HOME.TITLE' | translate"
    [subtitle]="'HOME.SUBTITLE' | translate:{ name: userName() }" />
  <!-- Country and department filters live in the workforce cards' detail pop-up (#detailTpl). -->

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-body-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <rh-quick-actions-section
    class="order-2 md:order-1"
    [pendingRequests]="stats()?.pendingRequests ?? 0"
    (navigate)="onQuickAction($event)" />

  <rh-overview-section
    class="order-1 md:order-2"
    [probationAlerts]="probation()"
    [probationTotal]="probationTotal()"
    [missingDocsAlerts]="missingDocAlerts()"
    [missingDocsTotal]="missingDocsTotal()"
    [totalActifs]="workforce()?.totalActifs ?? 0"
    [pctFemmes]="workforce()?.pctFemmes"
    [pctHommes]="workforce()?.pctHommes"
    [byCountry]="workforce()?.byCountry ?? []"
    [ingProjTotal]="(workforce()?.ingenieurs ?? 0) + (workforce()?.projeteurs ?? 0)"
    [seniorityTotal]="(workforce()?.juniors ?? 0) + (workforce()?.confirmes ?? 0) + (workforce()?.seniors ?? 0) + (workforce()?.ancienneteNonDefinie ?? 0)"
    [pctIngenieurs]="workforce()?.pctIngenieurs"
    [pctProjeteurs]="workforce()?.pctProjeteurs"
    [pctJuniors]="workforce()?.pctJuniors"
    [pctConfirmes]="workforce()?.pctConfirmes"
    [pctSeniors]="workforce()?.pctSeniors"
    [femmes]="workforce()?.femmes"
    [hommes]="workforce()?.hommes"
    [ingenieurs]="workforce()?.ingenieurs"
    [projeteurs]="workforce()?.projeteurs"
    [juniors]="workforce()?.juniors"
    [confirmes]="workforce()?.confirmes"
    [seniors]="workforce()?.seniors"
    [tauxGlobalPct]="completion()?.tauxGlobalPct ?? 0"
    [dossiersIncomplets]="completion()?.dossiersIncomplets ?? 0"
    (cardOpen)="onCardOpen($event)" />

  <rh-joiners-section
    class="order-3"
    [employees]="employeeCards()"
    [anniversaires]="anniversaires()"
    [nouveaux]="nouveaux()"
    (viewProfile)="onViewProfile($event)" />

</daf-page>

<!-- Detail pop-up of a workforce card — projected into daf-modal-host by ModalService
     (onCardOpen). rh-workforce-detail (KPI tiles, ring, one library chart) is fed by
     `detailWorkforce`, which the department filter reloads; the page's own cards are
     never filtered. -->
<ng-template #detailTpl>
  <div class="flex flex-col gap-4">
    <!-- Country (cross-country admins only, same options as the page header) then
         department — the department list follows the country picked here. -->
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      @if (canSwitchPays() && paysOptions().length > 2) {
        <daf-select
          class="block"
          [options]="paysOptions()"
          [selected]="detailPaysValue()"
          [config]="{ label: ('HOME.COUNTRY_PICKER' | translate), fullWidth: true, searchable: true }"
          (selectedChange)="onDetailPaysChange($event)" />
      }
      @if (departmentOptions().length > 1) {
        <daf-select
          class="block"
          [options]="departmentOptions()"
          [selected]="selectedDepartmentValue()"
          [config]="{ label: ('HOME.DEPARTMENT_PICKER' | translate), fullWidth: true, searchable: true }"
          (selectedChange)="onDepartmentChange($event)" />
      }
    </div>

    <div class="transition-opacity" [class.opacity-50]="detailLoading()">
      @if (detailWorkforce(); as w) {
        <rh-workforce-detail [card]="detailCard()" [data]="w" />
      } @else if (!detailLoading()) {
        <p class="text-body-sm text-danger">{{ 'HOME.LOAD_ERROR' | translate }}</p>
      }
    </div>
  </div>
</ng-template>
