<div class="re-container">
  <!-- Real daf-tabs strip, same convention as /rh/profiles/:id — [hidden] panels below
       (rather than @switch) so tab state stays mounted across switches. -->
  <daf-tabs #tabsRef
    class="re-tabs"
    variant="underline"
    [tabs]="tabs()"
    [active]="activeTab()"
    (activeChange)="onTabChange($event)"
    [tabsLabel]="'ADMIN.roles.editor.TABS_ARIA' | translate"
    idPrefix="role-editor" />

  <div class="re-content" role="tabpanel"
       [id]="tabsRef.panelId(activeTab())"
       [attr.aria-labelledby]="tabsRef.tabId(activeTab())">
    <!-- Use [hidden] not @if so components stay mounted and preserve state between tab switches -->
    <div [hidden]="activeTab() !== 'info'">
      <app-role-info-tab
        [role]="role()"
        [allRoles]="allRoles()"
        (roleUpdated)="onRoleUpdated.emit($event)"
        (roleDeleted)="onRoleDeleted.emit($event)"
      />
    </div>
    <div [hidden]="activeTab() !== 'permissions'">
      <app-role-permissions-tab
        [role]="role()"
        (permissionsUpdated)="onRoleUpdated.emit($event)"
      />
    </div>
    <div [hidden]="activeTab() !== 'users'">
      <app-role-users-tab
        [role]="role()"
        (usersChanged)="onUsersChanged($event)"
      />
    </div>
  </div>
</div>
