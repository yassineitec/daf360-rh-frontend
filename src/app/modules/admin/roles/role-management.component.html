<div class="rm-layout">
  @if (error()) { <div class="rm-error">{{ error() }}</div> }

  @if (selectedRole()) {
    <!-- Full-page role editor. Breadcrumb replaces the back button, same
         daf-page/daf-page-header convention as /rh/admin's own "Rôles et permissions" entry. -->
    <div class="rm-detail">
      <daf-page [kpis]="0" [breadcrumbs]="true">
        <daf-page-header
          class="rm-breadcrumb-header"
          [title]="selectedRole()!.frenchName"
          [breadcrumbs]="[
            { label: ('ADMIN.shell.title' | translate) },
            { label: ('ADMIN.shell.tabs.roles' | translate) },
            { label: selectedRole()!.frenchName }
          ]"
          (breadcrumbNavigate)="onBreadcrumbNavigate($event)" />
        <app-role-editor
          [role]="selectedRole()!"
          [allRoles]="roles()"
          (onRoleUpdated)="onRoleUpdated($event)"
          (onRoleDeleted)="onRoleDeleted($event)"
        />
      </daf-page>
    </div>
  } @else {
    <app-role-list
      [roles]="roles()"
      [selectedRoleId]="null"
      [loading]="loading()"
      (roleSelected)="onRoleSelected($event)"
      (createClicked)="createRoleModal.open()"
      (deleteClicked)="onRoleDeleted($event.id)"
    />
  }
</div>

<app-create-role-modal #createRoleModal
  [allRoles]="roles()"
  (roleCreated)="onRoleCreated($event)"
/>
